[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "adaptive-log-anomaly-detection"
version = "0.1.0"
description = "Reproducible experiments for drift-aware log anomaly detector adaptation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Pham Truong Chinh" }]
dependencies = [
  "drain3==0.9.11",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pyarrow>=14,<24",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.3,<2",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
research = [
  "jupyterlab>=4,<5",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
adaptive-lad = "adaptive_lad.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_lad"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["adaptive_lad"]
ignore_missing_imports = true
